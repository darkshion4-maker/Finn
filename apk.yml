name: Bangun APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { id: siswa, nama: "Ujian Terjaga Siswa", paket: "id.sch.ujianterjaga.siswa" }
          - { id: guru,  nama: "Ujian Terjaga Guru",  paket: "id.sch.ujianterjaga.guru" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Capacitor
        run: npm install

      - name: Buat proyek Android
        run: |
          cat > capacitor.config.json <<JSON
          {
            "appId": "${{ matrix.app.paket }}",
            "appName": "${{ matrix.app.nama }}",
            "webDir": "www-${{ matrix.app.id }}",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Bangun APK (otomatis bertanda tangan debug, bisa langsung dipasang)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: APK-${{ matrix.app.id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
